name: Metrics

# Generates a static profile-metrics SVG and commits it to assets/metrics.svg,
# so the README can show stats that ALWAYS load (no dependency on a third-party
# service being up at view time).
#
on:
  schedule:
    - cron: "0 6 * * *"        # daily at 06:00 UTC
  workflow_dispatch:            # allow manual runs from the Actions tab
  push:
    branches: [ main, readme-improvements ]   # branch entry is temporary — for testing before merge
    paths: [ .github/workflows/metrics.yml ]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ganiyevuz
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tashkent
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
