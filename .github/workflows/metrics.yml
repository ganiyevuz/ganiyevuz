name: Metrics

# Generates a static profile-metrics SVG and commits it to assets/metrics.svg,
# so the README can show stats that ALWAYS load (no dependency on a third-party
# service being up at view time).
#
# One-time setup before this is useful:
#   1. Create a classic Personal Access Token (no scopes needed for public data;
#      add the `repo` scope to also count private contributions) at
#      https://github.com/settings/tokens
#   2. Add it as a repository secret named METRICS_TOKEN
#      (repo Settings → Secrets and variables → Actions → New repository secret)
#   3. Run this workflow once from the Actions tab (workflow_dispatch).
#   4. Once assets/metrics.svg exists, add it to the README, e.g.:
#        <img src="./assets/metrics.svg" alt="Metrics" />

on:
  schedule:
    - cron: "0 6 * * *"        # daily at 06:00 UTC
  workflow_dispatch:            # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ganiyevuz
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tashkent
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
