name: Metrics

# Generates a static profile-metrics SVG and commits it to assets/metrics.svg,
# so the README can show stats that ALWAYS load (no dependency on a third-party
# service being up at view time).
#
on:
  # Dormant: the metrics card isn't shown in the README right now. Run this
  # manually from the Actions tab to regenerate assets/metrics.svg, then embed
  # it in the README. Re-enable the daily schedule below when you display it.
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # daily at 06:00 UTC

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ganiyevuz
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tashkent
          config_order: base.header, base.activity, isocalendar, languages, base.community, base.repositories, lines, habits, base.metadata
          # Eye-catching 3D commit calendar (full year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Languages breakdown with size + percentage
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Lines of code changed
          plugin_lines: yes
          # Coding habits + time-of-day charts
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
